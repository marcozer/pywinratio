[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pywinratio"
dynamic = ["version"]
description = "Win ratio, net benefit and win odds for hierarchical composite outcomes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Marc-Anthony Chouillard" },
  { name = "Thomas Husson" },
]
maintainers = [
  { name = "Marc-Anthony Chouillard" },
]
keywords = [
  "win ratio",
  "win odds",
  "net benefit",
  "generalized pairwise comparisons",
  "hierarchical composite endpoint",
  "Finkelstein-Schoenfeld",
  "prioritized outcomes",
  "clinical trials",
  "propensity score",
  "biostatistics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
study = ["matplotlib>=3.7", "pyyaml>=6.0"]
docs = [
  "sphinx>=7.2",
  "pydata-sphinx-theme>=0.15",
  "myst-nb>=1.1",
  "numpydoc>=1.7",
  "sphinx-copybutton>=0.5",
  "ipykernel>=6.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]
dev = [
  "build>=1.2",
  "twine>=5.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/marcozer/pywinratio"
Documentation = "https://pywinratio.readthedocs.io"
Repository = "https://github.com/marcozer/pywinratio"
Changelog = "https://github.com/marcozer/pywinratio/blob/main/CHANGELOG.md"
Issues = "https://github.com/marcozer/pywinratio/issues"

[tool.setuptools.dynamic]
version = { attr = "pywinratio._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pywinratio*", "winratio", "winratiopy"]

[tool.setuptools.package-data]
pywinratio = ["py.typed"]
winratio = ["py.typed"]
winratiopy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:the 'winratio(py)?' package was renamed:DeprecationWarning",
]

[tool.coverage.run]
source = ["pywinratio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/winratio/__init__.py" = ["F403", "E402"]
"src/winratiopy/__init__.py" = ["F403", "E402"]
"tests/*" = ["B018"]
